name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix on purpose: tests use fixtures, not the live OS,
        # so they must pass on a non-Linux machine too.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: pytest --cov --cov-report=term-missing
